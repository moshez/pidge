# Build the Lambda image and apply the main stack on every push to trunk.
#
# Needs (docs/SETUP.md, steps 3-5):
#   secrets: CLOUDFLARE_API_TOKEN
#   variables: AWS_DEPLOY_ROLE_ARN, TF_STATE_BUCKET, MAIL_DOMAIN, OWNER_EMAIL,
#              COGNITO_DOMAIN_PREFIX; optionally ECR_REPOSITORY (default pidge)
#              and MESSAGE_ID_DOMAIN (default us-west-2.amazonses.com)
name: deploy

on:
  push:
    branches: [trunk]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'pidge' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the calendar version is computed from git history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the wheel
        run: |
          pip install --upgrade pip nox boto3
          nox --session build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        run: |
          docker buildx build --platform linux/amd64 --provenance=false \
            --load -t pidge:candidate .

      - name: Smoke-test the image (SQLite FTS5 and imports)
        run: |
          docker run --rm --entrypoint python3 pidge:candidate -c '
          import sqlite3
          sqlite3.connect(":memory:").execute("CREATE VIRTUAL TABLE t USING fts5(a)")
          import pidge.lambda_main
          print("ok", sqlite3.sqlite_version)
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the image
        id: push
        env:
          REPOSITORY_URL: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker tag pidge:candidate "$REPOSITORY_URL:$GITHUB_SHA"
          docker push "$REPOSITORY_URL:$GITHUB_SHA"
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "repository_url=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false

      - name: Apply the main stack
        working-directory: infra/main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_mail_domain: ${{ vars.MAIL_DOMAIN }}
          TF_VAR_owner_email: ${{ vars.OWNER_EMAIL }}
          TF_VAR_cognito_domain_prefix: ${{ vars.COGNITO_DOMAIN_PREFIX }}
          TF_VAR_image_uri: ${{ steps.push.outputs.repository_url }}
          TF_VAR_image_digest: ${{ steps.push.outputs.digest }}
          TF_VAR_message_id_domain: ${{ vars.MESSAGE_ID_DOMAIN || 'us-west-2.amazonses.com' }}
        run: |
          tofu init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          tofu apply -input=false -auto-approve
          tofu output
